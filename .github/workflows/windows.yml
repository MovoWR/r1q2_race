name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows ${{ matrix.arch }} Release
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            toolchain: amd64_x86
          - arch: x64
            toolchain: amd64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set package version
        shell: pwsh
        run: |
          $revision = git rev-list --count HEAD
          if ($LASTEXITCODE -ne 0 -or $revision -notmatch '^[0-9]+$') {
            throw 'Could not determine the client revision'
          }
          "VERSION=r$revision" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.toolchain }}

      - name: Download OpenAL Soft
        timeout-minutes: 8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force build/deps | Out-Null
          $archive = 'build/deps/openal-soft-1.23.1.tar.bz2'
          curl.exe --fail --location --show-error --connect-timeout 20 --max-time 120 --retry 2 --retry-delay 5 --retry-max-time 360 --output $archive https://openal-soft.org/openal-releases/openal-soft-1.23.1.tar.bz2
          if ($LASTEXITCODE -ne 0) {
            throw "OpenAL Soft download failed (curl exit code $LASTEXITCODE)"
          }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '796f4b89134c4e57270b7f0d755f0fa3435b90da437b745160a49bd41c845b21') {
            throw 'OpenAL Soft source checksum mismatch'
          }
          Write-Host 'OpenAL Soft download and SHA-256 verification complete'

      - name: Extract OpenAL Soft
        timeout-minutes: 2
        shell: pwsh
        working-directory: build/deps
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -E tar xvf openal-soft-1.23.1.tar.bz2
          if ($LASTEXITCODE -ne 0) {
            throw "OpenAL Soft extraction failed (cmake exit code $LASTEXITCODE)"
          }
          if (-not (Test-Path openal-soft-1.23.1/CMakeLists.txt)) {
            throw 'OpenAL Soft extraction did not produce the expected source directory'
          }

      - name: Configure OpenAL Soft
        shell: pwsh
        run: >-
          cmake -S build/deps/openal-soft-1.23.1 -B build/deps/openal-build -G Ninja
          -DCMAKE_BUILD_TYPE=Release "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          "-DCMAKE_INSTALL_PREFIX=$env:GITHUB_WORKSPACE/build/deps/openal"
          -DLIBTYPE=STATIC -DFORCE_STATIC_VCRT=ON
          -DALSOFT_UTILS=OFF -DALSOFT_NO_CONFIG_UTIL=ON -DALSOFT_EXAMPLES=OFF
          -DALSOFT_BUILD_ROUTER=OFF -DALSOFT_UPDATE_BUILD_VERSION=OFF
          -DALSOFT_INSTALL=ON -DALSOFT_INSTALL_CONFIG=OFF
          -DALSOFT_INSTALL_HRTF_DATA=OFF -DALSOFT_INSTALL_AMBDEC_PRESETS=OFF
          -DALSOFT_INSTALL_EXAMPLES=OFF -DALSOFT_INSTALL_UTILS=OFF
          -DALSOFT_EMBED_HRTF_DATA=ON -DALSOFT_EAX=ON -DALSOFT_NO_UID_DEFS=OFF
          -DALSOFT_BACKEND_WAVE=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_SDL2=ON -DCMAKE_DISABLE_FIND_PACKAGE_Git=ON
          -DALSOFT_BACKEND_WINMM=ON -DALSOFT_REQUIRE_WINMM=ON
          -DALSOFT_BACKEND_DSOUND=ON -DALSOFT_REQUIRE_DSOUND=ON
          -DALSOFT_BACKEND_WASAPI=ON -DALSOFT_REQUIRE_WASAPI=ON
          -DALSOFT_BACKEND_PIPEWIRE=OFF -DALSOFT_BACKEND_PULSEAUDIO=OFF
          -DALSOFT_BACKEND_JACK=OFF -DALSOFT_BACKEND_COREAUDIO=OFF
          -DALSOFT_BACKEND_OBOE=OFF -DALSOFT_BACKEND_OPENSL=OFF
          -DALSOFT_BACKEND_PORTAUDIO=OFF -DALSOFT_BACKEND_SDL2=OFF

      - name: Build OpenAL Soft
        run: cmake --build build/deps/openal-build --target install --parallel

      - name: Configure client
        shell: pwsh
        run: >-
          cmake -S . -B build/windows -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DR1Q2_CORE_RENDERER=ON -DR1Q2_HTTP_DOWNLOADS=ON
          -DR1Q2_CHAT_TRANSLATOR=OFF -DR1Q2_AVCODEC=OFF -DR1Q2_OPENAL=ON
          "-DR1Q2_OPENAL_ROOT=$env:GITHUB_WORKSPACE/build/deps/openal"

      - name: Compile client
        run: cmake --build build/windows --target r1q2 --parallel

      - name: Validate client assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content assets/jump-assets.json -Raw | ConvertFrom-Json
          $assetRoot = (Resolve-Path assets).Path
          $expected = @($manifest.files | ForEach-Object { $_.path })
          $actual = @(Get-ChildItem assets/jump -Recurse -File | ForEach-Object {
            [IO.Path]::GetRelativePath($assetRoot, $_.FullName).Replace('\', '/')
          })
          if ($expected.Count -eq 0 -or ($expected | Sort-Object -Unique).Count -ne $expected.Count -or
              (Compare-Object ($expected | Sort-Object) ($actual | Sort-Object) -CaseSensitive)) {
            throw 'Asset manifest differs from assets/jump inventory'
          }
          foreach ($asset in $manifest.files) {
            $path = Join-Path $assetRoot $asset.path
            if ((Get-Item -LiteralPath $path).Length -ne $asset.bytes -or
                (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ne $asset.sha256) {
              throw "Asset hash or size mismatch: $($asset.path)"
            }
          }

      - name: Package client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory artifacts | Out-Null
          Copy-Item build/windows/r1q2_race.exe artifacts/
          Copy-Item assets/jump artifacts/jump -Recurse
          New-Item -ItemType Directory artifacts/licenses, artifacts/source -Force | Out-Null
          Copy-Item COPYING artifacts/licenses/COPYING.txt
          Copy-Item client/jump/LICENSE artifacts/licenses/MPL-2.0.txt
          Copy-Item assets/jump-assets.json artifacts/source/jump-assets.json

      - name: Upload client
        uses: actions/upload-artifact@v7
        with:
          name: r1q2_race-windows-${{ matrix.arch }}-${{ env.VERSION }}
          path: artifacts/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: r1q2-race-latest-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download client packages
        uses: actions/download-artifact@v8
        with:
          pattern: r1q2_race-windows-*
          path: artifacts

      - name: Compress release packages
        shell: bash
        run: |
          shopt -s nullglob
          packages=(artifacts/r1q2_race-windows-*)
          test "${#packages[@]}" -eq 2
          for dir in "${packages[@]}"; do
            test -f "$dir/r1q2_race.exe"
            test -d "$dir/jump"
            (cd "$dir" && zip -r "../$(basename "$dir").zip" .)
          done

      - name: Create or update latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A slower build of an older commit must not replace the latest build.
          current=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo 'Skipping release: main has advanced beyond this build.'
            exit 0
          fi
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest artifacts/*.zip --clobber
            gh release edit latest --title "Latest" --notes "Automatically updated latest build" --latest
          else
            gh release create latest artifacts/*.zip --target "$GITHUB_SHA" --title "Latest" --notes "Automatically updated latest build" --latest
          fi
          gh api --method PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true

          # Remove old versions only after publishing the replacement packages.
          release_id=$(gh api "repos/$GH_REPO/releases/tags/latest" --jq .id)
          assets=$(gh api --paginate "repos/$GH_REPO/releases/$release_id/assets" --jq '.[] | [.id, .name] | @tsv')
          while IFS=$'\t' read -r asset_id name; do
            if [[ "$name" =~ ^r1q2_race-windows-(x86|x64)-r[0-9]+\.zip$ ]] &&
               [[ ! -f "artifacts/$name" ]]; then
              gh api --method DELETE "repos/$GH_REPO/releases/assets/$asset_id"
            fi
          done <<< "$assets"
